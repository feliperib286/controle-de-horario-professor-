<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horários Escolares 2026</title>

<!-- ✅ CORRIGIDO -->
https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body{font-family:Arial;background:#f5f5f5;padding:20px}
.tabs{display:flex;gap:5px;margin-bottom:10px}
.tab{padding:10px;background:#ddd;cursor:pointer}
.tab.active{background:#185FA5;color:#fff}
.panel{display:none}
.panel.active{display:block}
table{border-collapse:collapse;width:100%;margin-top:10px}
th,td{border:1px solid #ccc;padding:6px;text-align:center}
</style>
</head>

<body>

<h2>📅 Horário Escolar</h2>

<div class="tabs">
<div class="tab active" onclick="trocar('excel',this)">Importar</div>
<div class="tab" onclick="trocar('grade',this)">Grade</div>
</div>

<div id="excel" class="panel active">
<input type="file" id="fileInput">
</div>

<div id="grade" class="panel">
<button onclick="gerar()">Gerar Grade</button>
<div id="saida"></div>
</div>

<script>
let dados=[];

const dias=["Segunda","Terça","Quarta","Quinta","Sexta"];
const aulas=6;

// ================== TROCA ABA ==================
function trocar(id,el){
 document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
 document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
 el.classList.add('active');
 document.getElementById(id).classList.add('active');
}

// ================== LEITURA EXCEL ==================
document.getElementById('fileInput').addEventListener('change',function(e){

 const file=e.target.files[0];
 if(!file) return;

 const reader=new FileReader();
 reader.onload=function(evt){

   const wb=XLSX.read(new Uint8Array(evt.target.result),{type:'array'});
   dados=[];

   wb.SheetNames.forEach(nome=>{
     const ws=wb.Sheets[nome];
     const rows=XLSX.utils.sheet_to_json(ws,{header:1});

     const periodo=nome.toUpperCase().includes("MANHA")?"Manhã":"Tarde";

     parsearAba(rows,periodo);
   });

   alert("✅ Arquivo carregado: "+dados.length+" aulas");

 };

 reader.readAsArrayBuffer(file);

});

// ================== PARSER NOVO (FUNCIONA MESMO) ==================
function parsearAba(rows, periodo){

 let turmas=[];
 let colTurmas=[];

 for(let r=0;r<rows.length;r++){

   const row=(rows[r]||[]).map(v=>limpar(v));

   // detectar linha SALAS
   if(row.includes("SALAS")){
     turmas=[];
     colTurmas=[];

     row.forEach((cell,c)=>{
       if(isTurma(cell)){
         turmas.push(cell);
         colTurmas.push(c);
       }
     });
     continue;
   }

   // detectar dia
   const dia=detectarDia(row[0]);
   if(!dia) continue;

   // ler linhas pra baixo
   for(let rr=r+1; rr<rows.length; rr++){

     const linha=(rows[rr]||[]).map(v=>limpar(v));
     const texto=linha[0];

     if(detectarDia(texto)) break;

     const hIdx=mapHorario(texto);
     if(!hIdx) continue;

     colTurmas.forEach((col,i)=>{

       const valor=linha[col];
       if(!valor) return;

       const {mat,prof}=parseCelula(valor);
       if(!mat) return;

       dados.push({
         periodo,
         turma:turmas[i],
         dia,
         aula:hIdx,
         materia:mat,
         professor:prof
       });

     });
   }
 }
}

// ================== FUNÇÕES AUX ==================
function limpar(v){
 if(!v) return "";
 return String(v).trim().toUpperCase();
}

function detectarDia(txt){
 if(!txt) return "";
 if(txt.includes("2")) return "Segunda";
 if(txt.includes("3")) return "Terça";
 if(txt.includes("4")) return "Quarta";
 if(txt.includes("5")) return "Quinta";
 if(txt.includes("6")) return "Sexta";
 return "";
}

function mapHorario(txt){
 if(!txt) return 0;
 if(txt.includes("1")) return 1;
 if(txt.includes("2")) return 2;
 if(txt.includes("3")) return 3;
 if(txt.includes("4")) return 4;
 if(txt.includes("5")) return 5;
 if(txt.includes("6")) return 6;
 return 0;
}

function isTurma(t){
 return t && (t.includes("ANO")||t.match(/[0-9][ºª]/));
}

function parseCelula(c){
 const parts=c.split(" ");
 return {
   mat:parts[0],
   prof:parts.slice(1).join(" ")
 };
}

// ================== GERAR GRADE ==================
function gerar(){

 let grade={};

 dados.forEach(d=>{

   if(!grade[d.turma]){
     grade[d.turma]={};
     dias.forEach(x=>grade[d.turma][x]=Array(aulas).fill("-"));
   }

   grade[d.turma][d.dia][d.aula-1]=d.materia+" ("+d.professor+")";

 });

 let html="";

 for(let turma in grade){

   html+="<h3>"+turma+"</h3>";
   html+="<table><tr><th>Aula</th>";

   dias.forEach(d=>html+="<th>"+d+"</th>");
   html+="</tr>";

   for(let i=0;i<aulas;i++){
     html+="<tr><td>"+(i+1)+"</td>";
     dias.forEach(d=>{
       html+="<td>"+grade[turma][d][i]+"</td>";
     });
     html+="</tr>";
   }

   html+="</table>";
 }

 document.getElementById("saida").innerHTML=html;
}
</script>

</body>
</html>
