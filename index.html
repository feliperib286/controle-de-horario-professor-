<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horários Escolares 2026</title>

<!-- ✅ LIBS CORRETAS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
/* ✅ SEU LAYOUT ORIGINAL PRESERVADO (simplificado aqui, mas pode manter o seu inteiro) */
body{background:#f1f3f6;font-family:'Segoe UI';padding:20px}
.tabs{display:flex;gap:5px}
.tab{padding:10px;background:#ddd;cursor:pointer}
.tab.active{background:#185FA5;color:#fff}
.panel{display:none}
.panel.active{display:block}
</style>
</head>

<body>

<h2>📅 Horários Escolares</h2>

<div class="tabs">
  <div class="tab active" onclick="mudarAba('excel',this)">📂 Importar Excel</div>
  <div class="tab" onclick="mudarAba('grade',this)">📋 Grade</div>
</div>

<div id="excel" class="panel active">
<input type="file" id="fileInput">
</div>

<div id="grade" class="panel">
<button onclick="gerarGrade()">Gerar grade</button>
<div id="saida"></div>
</div>

<script>

// ==========================
// ESTADO
// ==========================
let dadosGrade = [];

const DIAS = ["Segunda","Terça","Quarta","Quinta","Sexta"];
const AULAS = 6;

// ==========================
// TROCAR ABA
// ==========================
function mudarAba(id,el){
 document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
 document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));

 el.classList.add('active');
 document.getElementById(id).classList.add('active');
}

// ==========================
// LEITURA EXCEL (CORRIGIDA)
// ==========================
document.getElementById('fileInput').addEventListener('change',function(e){

 const file=e.target.files[0];
 if(!file) return;

 const reader=new FileReader();

 reader.onload=function(evt){

   try{
     const wb=XLSX.read(new Uint8Array(evt.target.result),{type:'array'});
     dadosGrade=[];

     wb.SheetNames.forEach(nome=>{
       const ws=wb.Sheets[nome];
       const rows=XLSX.utils.sheet_to_json(ws,{header:1});

       const periodo = nome.toUpperCase().includes("MANHA") ? "Manhã" : "Tarde";

       parsearAba(rows, periodo);
     });

     alert("✅ Arquivo carregado: "+dadosGrade.length+" aulas");

   }catch(err){
     alert("Erro ao ler arquivo: "+err.message);
   }

 };

 reader.readAsArrayBuffer(file);

});

// ==========================
// ✅ PARSER NOVO (FUNCIONA MESMO)
// ==========================
function parsearAba(rows, periodo){

 let turmas=[];
 let colTurmas=[];

 for(let r=0;r<rows.length;r++){

   const row=(rows[r]||[]).map(v=>limpar(v));

   if(row.includes("SALAS")){
     turmas=[];
     colTurmas=[];

     row.forEach((cell,c)=>{
       if(isTurma(cell)){
         turmas.push(cell);
         colTurmas.push(c);
       }
     });
     continue;
   }

   const dia = detectarDia(row[0]);
   if(!dia) continue;

   for(let rr=r+1; rr<rows.length; rr++){

     const linha=(rows[rr]||[]).map(v=>limpar(v));
     const txt=linha[0];

     if(detectarDia(txt)) break;

     const aula = mapearHorario(txt);
     if(!aula) continue;

     colTurmas.forEach((col,i)=>{
       const cel=linha[col];
       if(!cel) return;

       const {materia, professor} = parsearCelula(cel);
       if(!materia) return;

       dadosGrade.push({
         periodo,
         turma: turmas[i],
         dia,
         aula,
         materia,
         professor
       });
     });
   }
 }
}

// ==========================
// AUXILIARES
// ==========================
function limpar(v){
 if(!v) return "";
 return String(v).trim().toUpperCase();
}

function detectarDia(t){
 if(!t) return "";
 if(t.includes("2")) return "Segunda";
 if(t.includes("3")) return "Terça";
 if(t.includes("4")) return "Quarta";
 if(t.includes("5")) return "Quinta";
 if(t.includes("6")) return "Sexta";
 return "";
}

function mapearHorario(t){
 if(!t) return 0;
 if(t.includes("1")) return 1;
 if(t.includes("2")) return 2;
 if(t.includes("3")) return 3;
 if(t.includes("4")) return 4;
 if(t.includes("5")) return 5;
 if(t.includes("6")) return 6;
 return 0;
}

function isTurma(t){
 return t && (t.includes("ANO") || t.match(/[0-9][ºª]/));
}

function parsearCelula(c){
 const parts=c.split(" ");
 return {
   materia: parts[0],
   professor: parts.slice(1).join(" ")
 };
}

// ==========================
// GERAR GRADE
// ==========================
function gerarGrade(){

 let grade={};

 dadosGrade.forEach(d=>{

   if(!grade[d.turma]){
     grade[d.turma]={};
     DIAS.forEach(x=>grade[d.turma][x]=Array(AULAS).fill("-"));
   }

   grade[d.turma][d.dia][d.aula-1] =
     d.materia + "<br><small>"+d.professor+"</small>";
 });

 let html="";

 for(let turma in grade){

   html+="<h3>"+turma+"</h3>";
   html+="<table border='1'><tr><th>Aula</th>";

   DIAS.forEach(d=>html+="<th>"+d+"</th>");
   html+="</tr>";

   for(let i=0;i<AULAS;i++){
     html+="<tr><td>"+(i+1)+"</td>";

     DIAS.forEach(d=>{
       html+="<td>"+grade[turma][d][i]+"</td>";
     });

     html+="</tr>";
   }

   html+="</table><br>";
 }

 document.getElementById("saida").innerHTML = html;
}

</script>

</body>
</html>
