<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Gerador de Horário Escolar</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body{font-family:Arial;padding:20px;background:#f5f5f5}
button{padding:8px 15px;margin-top:10px}
table{border-collapse:collapse;margin-top:20px;width:100%}
th,td{border:1px solid #ccc;padding:6px;text-align:center}
th{background:#eee}
</style>
</head>

<body>

<h2>📅 Gerador de grade automática (CSV SEDUC)</h2>

<input type="file" id="fileInput" accept=".csv,.xlsx">
<br>
<button onclick="gerarGrade()">Gerar Grade</button>

<div id="resultado"></div>

<script>
let dados = [];

// =========================
// LEITURA DE ARQUIVO
// =========================
document.getElementById('fileInput').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;

  if(file.name.endsWith('.csv')){
    lerCSV(file);
  } else {
    lerExcel(file);
  }
});

// =========================
// CSV
// =========================
function lerCSV(file){
  const reader = new FileReader();

  reader.onload = function(e){
    const texto = e.target.result;

    const linhas = texto.split('\n').map(l => l.split(';'));
    
    // remover cabeçalhos
    linhas.shift();
    const headers = linhas.shift();

    dados = linhas.map(l => {
      if(l.length < 11) return null;

      const turma = l[8] || '';
      const disciplina = l[10] || '';
      const professor = l[0] || '';

      if(!turma || !disciplina) return null;

      const periodo = turma.includes("MANHA") ? "Manhã" : "Tarde";

      return {
        professor,
        turma,
        disciplina,
        periodo,
        aulas: parseInt(l[9]) || 1
      };
    }).filter(x => x);

    alert("✅ CSV carregado: " + dados.length + " registros");
  };

  reader.readAsText(file, 'utf-8');
}

// =========================
// EXCEL (opcional)
// =========================
function lerExcel(file){
  const reader = new FileReader();

  reader.onload = function(e){
    const arr = new Uint8Array(e.target.result);
    const wb = XLSX.read(arr, {type:'array'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws);

    dados = rows.map(r => ({
      professor: r.Professor,
      turma: r.Turma,
      disciplina: r.Disciplina,
      periodo: r.Turma.includes("MANHA") ? "Manhã" : "Tarde",
      aulas: r["Qtde. Aulas"] || 1
    }));

    alert("✅ Excel carregado");
  };

  reader.readAsArrayBuffer(file);
}

// =========================
// GERAR GRADE AUTOMÁTICA
// =========================
function gerarGrade(){
  if(!dados.length){
    alert("Carregue o arquivo primeiro");
    return;
  }

  const dias = ["Segunda","Terça","Quarta","Quinta","Sexta"];
  const horarioMax = 6;

  // estrutura: turma -> grade
  let grade = {};

  dados.forEach(d => {
    if(!grade[d.turma]){
      grade[d.turma] = {};
      dias.forEach(dia => {
        grade[d.turma][dia] = Array(horarioMax).fill(null);
      });
    }

    // distribuir aulas
    let count = d.aulas;

    for(let dia of dias){
      for(let h=0; h<horarioMax; h++){
        if(count <= 0) break;

        if(!grade[d.turma][dia][h]){
          grade[d.turma][dia][h] = {
            disc: d.disciplina,
            prof: d.professor
          };
          count--;
        }
      }
    }

  });

  renderTabela(grade);
}

// =========================
// RENDER
// =========================
function renderTabela(grade){

  let html = "";

  Object.keys(grade).forEach(turma => {

    html += `<h3>Turma: ${turma}</h3>`;

    html += "<table>";
    html += "<tr><th>Aula</th><th>Seg</th><th>Ter</th><th>Qua</th><th>Qui</th><th>Sex</th></tr>";

    for(let i=0;i<6;i++){
      html += `<tr><td>${i+1}ª</td>`;

      ["Segunda","Terça","Quarta","Quinta","Sexta"].forEach(dia => {
        const aula = grade[turma][dia][i];

        if(aula){
          html += `<td><b>${aula.disc}</b><br><small>${aula.prof}</small></td>`;
        } else {
          html += "<td>-</td>";
        }
      });

      html += "</tr>";
    }

    html += "</table><br>";
  });

  document.getElementById("resultado").innerHTML = html;
}

</script>

</body>
</html>
